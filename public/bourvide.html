<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bourvide</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --white-cell: #ffffff;
            --black-cell: #334155;
            --player-color: #3b82f6;
            --accent-color: #6366f1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin: 5px 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .game-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }

        .board-wrapper {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(10, 42px);
            grid-template-rows: repeat(10, 42px);
            gap: 4px;
        }

        .cell {
            width: 42px;
            height: 42px;
            border-radius: 6px;
            transition: background-color 0.15s ease, transform 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell.white {
            background-color: var(--white-cell);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
        }

        .cell.black {
            background-color: var(--black-cell);
        }

        .player {
            width: 28px;
            height: 28px;
            background-color: var(--player-color);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--player-color);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(59, 130, 246, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        .sidebar {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            width: 280px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .stats {
            margin-bottom: 20px;
        }

        .stats p {
            margin: 8px 0;
            font-size: 1.05rem;
            display: flex;
            justify-content: space-between;
        }

        .stats span {
            font-weight: bold;
            color: #60a5fa;
        }

        .controls-guide h3 {
            margin-top: 0;
            font-size: 1.1rem;
            border-bottom: 2px solid #334155;
            padding-bottom: 6px;
        }

        .key-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            text-align: center;
            margin-top: 10px;
        }

        .key {
            background: #334155;
            padding: 8px 4px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: bold;
            font-size: 1rem;
            color: #f8fafc;
            border-bottom: 3px solid #1e293b;
        }

        .key.inactive {
            background: #1e293b;
            color: #64748b;
            border-bottom: 3px solid #0f172a;
        }

        .btn {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .message-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .message-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .message-card {
            background: var(--card-bg);
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            max-width: 360px;
        }

        .message-card h2 {
            margin-top: 0;
            font-size: 2rem;
        }
    </style>
</head>
<body>

    <h1>BOURVIDE</h1>
    <div class="subtitle">Remplis toute la grille sans te faire bloquer !</div>

    <div class="game-container">
        <div class="board-wrapper">
            <div id="grid" class="grid"></div>
        </div>

        <div class="sidebar">
            <div class="stats">
                <h3>Statistiques</h3>
                <p>Cases blanches : <span id="white-count">75</span></p>
                <p>Cases noires : <span id="black-count">25</span></p>
            </div>

            <div class="controls-guide">
                <h3>Contrôles (AZERTY)</h3>
                <div class="key-grid">
                    <div class="key">A</div>
                    <div class="key">Z</div>
                    <div class="key">E</div>
                    <div class="key">Q</div>
                    <div class="key inactive">S</div>
                    <div class="key">D</div>
                    <div class="key">W</div>
                    <div class="key">X</div>
                    <div class="key">C</div>
                </div>
                <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 10px; text-align: center;">
                    Carré 3x3 parfait (S ne fait rien).
                </p>
            </div>

            <button class="btn" onclick="initGame()">Nouvelle Partie</button>
        </div>
    </div>

    <div id="message-overlay" class="message-overlay">
        <div class="message-card">
            <h2 id="msg-title">Partie Terminée</h2>
            <p id="msg-desc">Description</p>
            <button class="btn" onclick="initGame()">Rejouer</button>
        </div>
    </div>

    <script>
        const GRID_SIZE = 10;
        let grid = [];
        let player = { x: 0, y: 0 };
        let gameActive = true;

        const keyMap = {
            'a': { x: -1, y: -1 }, // Haut-Gauche
            'z': { x:  0, y: -1 }, // Haut
            'e': { x:  1, y: -1 }, // Haut-Droite
            'q': { x: -1, y:  0 }, // Gauche
            's': { x:  0, y:  0 }, // Centre (rien)
            'd': { x:  1, y:  0 }, // Droite
            'w': { x: -1, y:  1 }, // Bas-Gauche
            'x': { x:  0, y:  1 }, // Bas
            'c': { x:  1, y:  1 }  // Bas-Droite
        };

        function generateSolvableGrid() {
            const TARGET_WHITE = 75;
            
            while (true) {
                let tempGrid = Array(GRID_SIZE).fill(0).map(() => Array(GRID_SIZE).fill(1));
                let path = [];
                let visited = new Set();
                
                let cx = Math.floor(Math.random() * GRID_SIZE);
                let cy = Math.floor(Math.random() * GRID_SIZE);
                
                path.push({x: cx, y: cy});
                visited.add(`${cx},${cy}`);
                
                let failed = false;
                while (path.length < TARGET_WHITE) {
                    let last = path[path.length - 1];
                    let neighbors = [];
                    
                    for (let dx = -1; dx <= 1; dx++) {
                        for (let dy = -1; dy <= 1; dy++) {
                            if (dx === 0 && dy === 0) continue;
                            let nx = last.x + dx;
                            let ny = last.y + dy;
                            if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE && !visited.has(`${nx},${ny}`)) {
                                neighbors.push({x: nx, y: ny});
                            }
                        }
                    }
                    
                    if (neighbors.length === 0) {
                        failed = true;
                        break;
                    }
                    
                    let next = neighbors[Math.floor(Math.random() * neighbors.length)];
                    path.push(next);
                    visited.add(`${next.x},${next.y}`);
                }
                
                if (!failed && path.length === TARGET_WHITE) {
                    for (let p of path) {
                        tempGrid[p.y][p.x] = 0;
                    }
                    return {
                        grid: tempGrid,
                        player: path[0]
                    };
                }
            }
        }

        function hasValidMoves(px, py) {
            const dirs = Object.values(keyMap);
            for (let d of dirs) {
                if (d.x === 0 && d.y === 0) continue;
                let nx = px + d.x;
                let ny = py + d.y;
                if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE && grid[ny][nx] === 0) {
                    return true;
                }
            }
            return false;
        }

        function countCells() {
            let white = 0, black = 0;
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (grid[r][c] === 0) white++;
                    else black++;
                }
            }
            return { white, black };
        }

        function initGame() {
            document.getElementById('message-overlay').classList.remove('active');
            
            const generated = generateSolvableGrid();
            grid = generated.grid;
            player.x = generated.player.x;
            player.y = generated.player.y;

            gameActive = true;
            render();
        }

        function render() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    
                    if (grid[r][c] === 1) {
                        cell.classList.add('black');
                    } else {
                        cell.classList.add('white');
                    }

                    if (player.x === c && player.y === r) {
                        const playerEl = document.createElement('div');
                        playerEl.classList.add('player');
                        cell.appendChild(playerEl);
                    }

                    gridEl.appendChild(cell);
                }
            }

            const counts = countCells();
            document.getElementById('white-count').innerText = counts.white;
            document.getElementById('black-count').innerText = counts.black;
        }

        function handleMove(dx, dy) {
            if (!gameActive || (dx === 0 && dy === 0)) return;

            let nx = player.x + dx;
            let ny = player.y + dy;

            if (nx < 0 || nx >= GRID_SIZE || ny < 0 || ny >= GRID_SIZE) return;
            if (grid[ny][nx] !== 0) return;

            // Transformer l'ancienne case en noire
            grid[player.y][player.x] = 1;

            // Avancer le joueur
            player.x = nx;
            player.y = ny;

            render();

            const counts = countCells();
            
            // CORRECTION DU BUG : Priorité absolue à la victoire
            // Quand le joueur est sur la dernière case blanche, il reste 0 case blanche libre
            if (counts.white === 1) { // Il ne reste que la case sur laquelle on est actuellement assis
                endGame(true);
            } else if (!hasValidMoves(player.x, player.y)) {
                endGame(false);
            }
        }

        function endGame(won) {
            gameActive = false;
            const overlay = document.getElementById('message-overlay');
            const title = document.getElementById('msg-title');
            const desc = document.getElementById('msg-desc');

            if (won) {
                title.innerText = "Victoire ! 🎉";
                title.style.color = "#4ade80";
                desc.innerText = "Incroyable, tu as rempli toute la grille sans encombre !";
            } else {
                title.innerText = "Perdu ! 💀";
                title.style.color = "#f87171";
                desc.innerText = "Tu es bloqué(e) et il reste encore des cases blanches.";
            }

            overlay.classList.add('active');
        }

        window.addEventListener('keydown', (e) => {
            let key = e.key.toLowerCase();
            if (keyMap[key] !== undefined) {
                e.preventDefault();
                handleMove(keyMap[key].x, keyMap[key].y);
            }
        });

        initGame();
    </script>
</body>
</html>
